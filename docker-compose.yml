version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adept-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/adept-backend
      - MONNIFY_SECRET_KEY=${MONNIFY_SECRET_KEY:-test_secret_key}
      - MONNIFY_API_KEY=${MONNIFY_API_KEY:-test_api_key}
      - MONNIFY_CONTRACT_CODE=${MONNIFY_CONTRACT_CODE:-test_contract_code}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - adept-network

  mongo:
    image: mongo:7-jammy
    container_name: adept-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - adept-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  adept-network:
    driver: bridge

volumes:
  mongo_data:
