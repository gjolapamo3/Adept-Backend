services:
  # -------------------------------------------------------------
  # 1. Node.js Backend Engine (SSE Broadcaster + Escrow + Webhooks)
  # -------------------------------------------------------------
  - type: web
    name: adept-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONNIFY_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: adept-frontend
          property: url

  # -------------------------------------------------------------
  # 2. React + Vite Frontend (Static Web Site)
  # -------------------------------------------------------------
  - type: web
    name: adept-frontend
    runtime: static
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      # SPA fallback for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: adept-backend
          property: url
      - key: VITE_SSE_ENDPOINT
        value: https://adept-backend.onrender.com/api/v1/marketplace/events
